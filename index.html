<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madeleine’s Routine</title>
  <meta name="theme-color" content="#10b981">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: linear-gradient(135deg,#ecfdf5,#e0f2fe); color:#111827; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { color:#6b7280; font-size:12px; margin-bottom:16px; }
    .tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:10px 0 16px; }
    .tab { padding:10px; border-radius:14px; border:1px solid #d4d4d8; background:#ffffffaa; cursor:pointer; text-align:center; font-size:14px; }
    .tab.active { border-color:#34d399; box-shadow:0 0 0 3px #a7f3d0; background:#fff; }
    .card { background:#fff; border:1px solid #e4e4e7; border-radius:16px; padding:12px; margin-bottom:12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .row { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid #e4e4e7; border-radius:10px; margin:6px 0; background:#fff; }
    .chk { width:30px; height:30px; border-radius:8px; border:2px solid #9ca3af; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .chk.on { background:#10b981; border-color:#10b981; color:#fff; }
    .btn { padding:8px 10px; border-radius:10px; border:1px solid #d4d4d8; background:#fff; cursor:pointer; }
    .btn.primary { background:#10b981; color:#fff; border-color:#10b981; }
    .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .progress { width:100%; height:8px; border-radius:6px; background:#e5e7eb; overflow:hidden; margin-top:6px; }
    .bar { height:100%; background:#10b981; transition: width 200ms ease; }
    .note { font-size:12px; color:#374151; }
    .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#ecfeff; color:#047857; border:1px solid #a7f3d0; }
    .confetti { position:fixed; inset:0; pointer-events:none; }
    .muted { color:#6b7280; font-size:12px; }
    .row.space { justify-content:space-between; }
    .flex { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .input { padding:8px 10px; border:1px solid #d4d4d8; border-radius:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Madeleine’s Routine</h1>
    <div class="sub" id="dateLine"></div>

    <div class="tabs" id="tabs"></div>
    <div id="content"></div>

    <div class="grid2">
      <div class="card" id="starsBoard"></div>
      <div class="card" id="tabletTime"></div>
    </div>

    <div class="grid2">
      <div class="card" id="moneyBank"></div>
      <div class="card" id="rewards"></div>
    </div>

    <div class="note">Daily: +30m baseline at midnight • +10m if both Morning & Evening are done • Each ⭐ = +10m • Weekly Chores +30m • Weekly Activities +30m. Weekly allowance adds $5 split S/S/D and +30m.</div>
  </div>
  <div class="confetti" id="confetti"></div>

<script>
// ---------- helpers ----------
const LS = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York";
const today = () => new Date().toLocaleDateString("en-US",{timeZone:tz});
const sundayKey = () => { const n=new Date(); const d=n.getDay(); const s=new Date(n); s.setDate(n.getDate()-d); return s.toLocaleDateString("en-US",{timeZone:tz}); };
const el = (sel) => document.querySelector(sel);
const fmt = (m)=>{ m=Math.max(0,Math.floor(m)); const h=Math.floor(m/60), mm=m%60; return h+"h "+mm+"m"; };

function confettiBurst(n=16){
  const host = el('#confetti'); host.innerHTML='';
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.style.position='absolute';
    s.style.left=(10+Math.random()*80)+'%';
    s.style.top=(20+Math.random()*60)+'%';
    s.textContent='🎉';
    s.style.transition='transform 900ms ease-out, opacity 900ms ease-out';
    host.appendChild(s);
    requestAnimationFrame(()=>{
      s.style.transform=`translate(${30+Math.random()*60}px, ${-40-Math.random()*60}px)`;
      s.style.opacity='0';
    });
    setTimeout(()=>s.remove(), 950);
  }
}

// ---------- state ----------
const DEFAULTS = {
  morning: ["🌞 Check loft bed (nothing hanging)","👗 Get dressed (PJs → hamper)","🧦 Put on socks","💇 Do hair (put hair stuff away)","🍎 Eat breakfast","🪥 Brush teeth + wash face","🎒 Pack backpack","👟 Put on shoes"],
  evening: ["🧹 Straighten room (use Clean Room)","👕 Change into PJs (dirty → hamper)","📚 Pick a book","📺 TV with Mom (25m)","📖 Read with Mom or Mr. Baby","🪥 Brush teeth + wash face","🎧 Turn on Audible","✨ Lights out"],
  clean:   ["👕 Dirty clothes → hamper","🩳 Fold clean clothes; put away","🧸 Put toys/books/games back","🛏️ Loft bed: everything up","🐻 Stuffies in stuffy pile","🗑️ Trash to bin","🍽️ Dishes/leftovers → kitchen","👟 Shoes lined up / closet","💇 Hair stuff on closet shelf","✨ Quick look — neat?"],
  chores:  ["🧹 Keep room clean","🧽 Sweep kitchen floor","🐾 Help feed pets (1 meal/day)"],
  activities: LS.get('activities_items', ["⚽ Soccer practice","🥅 Soccer game","🤸 Tumbling","🐴 Riding","🎹 Piano"]),
};
function bools(n){ return Array(n).fill(false); }

const state = {
  today: today(),
  week: sundayKey(),
  // checks
  morning: LS.get('morning_checks', bools(DEFAULTS.morning.length)),
  evening: LS.get('evening_checks', bools(DEFAULTS.evening.length)),
  clean:   LS.get('clean_checks',   bools(DEFAULTS.clean.length)),
  chores:  LS.get('chores_checks',  bools(DEFAULTS.chores.length)),
  activities: LS.get('activities_checks', bools(DEFAULTS.activities.length)),
  // locks
  morningLock: LS.get('morning_lock', null),
  eveningLock: LS.get('evening_lock', null),
  cleanLock:   LS.get('clean_lock',   null),
  choresLock:  LS.get('chores_lock',  null),
  activitiesLock: LS.get('activities_lock', null),
  // tablet/allowance
  mins: LS.get('tablet_time', 0),
  baselineDate: LS.get('baseline_date', null),
  dailyBonusDone: LS.get('daily_bonus_done', false),
  choresBonusDone: LS.get('weekly_chores_bonus_done', false),
  activitiesBonusDone: LS.get('weekly_activities_bonus_done', false),
  allowanceAdded: LS.get('allowance_added_week', false),
  stars: LS.get('stars', 0),
  rewards: LS.get('rewards', []),
};

function persist(){ for(const k in state){ LS.set(k, state[k]); } }

// Midnight baseline + resets
function resetTimers(){
  setInterval(()=>{
    const t = today(), w = sundayKey();
    if(t !== state.today){
      // daily reset
      state.today = t;
      state.morning = bools(DEFAULTS.morning.length);
      state.evening = bools(DEFAULTS.evening.length);
      state.clean   = bools(DEFAULTS.clean.length);
      state.morningLock = state.eveningLock = state.cleanLock = null;
      state.dailyBonusDone = false;
      // baseline +30 each new day
      if(state.baselineDate !== t){ state.mins += 30; state.baselineDate = t; }
      persist(); render();
    }
    if(w !== state.week){
      // weekly reset (Sunday)
      state.week = w;
      state.chores = bools(DEFAULTS.chores.length);
      state.activities = bools(DEFAULTS.activities.length);
      state.choresLock = state.activitiesLock = null;
      state.choresBonusDone = state.activitiesBonusDone = false;
      state.allowanceAdded = false;
      persist(); render();
    }
  }, 60*1000);
}

// ---------- UI builders ----------
const tabs = [
  {key:'Morning', label:'🌞 Morning'},
  {key:'Evening', label:'🌙 Evening'},
  {key:'Clean',   label:'🧹 Clean Room'},
  {key:'Chores',  label:'📆 Weekly Chores'},
  {key:'Activities',label:'🎯 Weekly Activities'}
];
let currentTab = 'Morning';

function mkChecklist(title, emoji, cycle, items, checks, lockKey){
  const locked = (cycle==='daily') ? (state[lockKey]===state.today) : (state[lockKey]===state.week);
  const doneCount = checks.filter(Boolean).length;
  const allDone = items.length>0 && doneCount===items.length;

  const card = document.createElement('div'); card.className='card';
  const head = document.createElement('div'); head.className='row space';
  head.innerHTML = `<div style="font-weight:600;font-size:18px">${emoji} ${title}</div>
    <div class="flex">
      <span class="pill">${doneCount}/${items.length}</span>
      <button class="btn" ${locked?'disabled':''} id="resetBtn">Reset</button>
    </div>`;
  card.appendChild(head);

  const prog = document.createElement('div'); prog.className='progress';
  const bar = document.createElement('div'); bar.className='bar'; bar.style.width = Math.round(doneCount/Math.max(1,items.length)*100)+'%';
  prog.appendChild(bar); card.appendChild(prog);
  if(locked){ const note=document.createElement('div'); note.className='muted'; note.textContent='🔒 Completed — locked until next reset.'; card.appendChild(note); }

  items.forEach((text, i)=>{
    const row = document.createElement('div'); row.className='row';
    const b = document.createElement('button'); b.className='chk'+(checks[i]?' on':''); b.textContent=checks[i]?'✓':'';
    b.onclick = ()=>{
      if(locked) return;
      checks[i]=!checks[i];
      if(checks[i]){ b.classList.add('on'); b.textContent='✓'; confettiBurst(); }
      else { b.classList.remove('on'); b.textContent=''; }
      persist(); render(); maybeBonuses();
    };
    const span = document.createElement('span'); span.textContent = text;
    row.appendChild(b); row.appendChild(span); card.appendChild(row);
  });

  card.querySelector('#resetBtn').onclick = ()=>{
    if(locked) return;
    for(let i=0;i<checks.length;i++) checks[i]=false;
    persist(); render();
  };

  if(allDone){
    const note = document.createElement('div'); note.className='note'; note.textContent = "🎉 You're all done! Great job! Let Mom know and congrats on earning more tablet time!";
    card.appendChild(note);
    if(cycle==='daily'){ state[lockKey]=state.today; }
    else { state[lockKey]=state.week; }
    persist();
  }
  return card;
}

function maybeBonuses(){
  // daily + baseline handled by timer; daily +10m when both morning+evening done
  const mDone = state.morning.every(Boolean) && state.morning.length===DEFAULTS.morning.length;
  const eDone = state.evening.every(Boolean) && state.evening.length===DEFAULTS.evening.length;
  if(mDone && eDone && !state.dailyBonusDone){ state.mins += 10; state.dailyBonusDone = true; }

  // weekly +30m for chores/activities
  const cDone = state.chores.every(Boolean) && state.chores.length===DEFAULTS.chores.length;
  const aDone = state.activities.every(Boolean) && state.activities.length===DEFAULTS.activities.length;
  if(cDone && !state.choresBonusDone){ state.mins += 30; state.choresBonusDone = true; }
  if(aDone && !state.activitiesBonusDone){ state.mins += 30; state.activitiesBonusDone = true; }

  persist(); renderTablet();
}

function renderTabs(){
  const host = el('#tabs'); host.innerHTML='';
  tabs.forEach(t=>{
    const b=document.createElement('button'); b.className='tab'+(currentTab===t.key?' active':'');
    b.textContent=t.label; b.onclick=()=>{ currentTab=t.key; render(); };
    host.appendChild(b);
  });
}

function renderContent(){
  const host = el('#content'); host.innerHTML='';
  if(currentTab==='Morning'){
    host.appendChild(mkChecklist('Morning','🌞','daily', DEFAULTS.morning, state.morning, 'morningLock'));
  } else if(currentTab==='Evening'){
    host.appendChild(mkChecklist('Evening','🌙','daily', DEFAULTS.evening, state.evening, 'eveningLock'));
  } else if(currentTab==='Clean'){
    host.appendChild(mkChecklist('Clean Room','🧹','daily', DEFAULTS.clean, state.clean, 'cleanLock'));
  } else if(currentTab==='Chores'){
    host.appendChild(mkChecklist('Weekly Chores','📆','weekly', DEFAULTS.chores, state.chores, 'choresLock'));
  } else {
    host.appendChild(mkChecklist('Weekly Activities','🎯','weekly', DEFAULTS.activities, state.activities, 'activitiesLock'));
    // simple editor
    const ed = document.createElement('div'); ed.className='card';
    ed.innerHTML = '<div style="font-weight:600;margin-bottom:8px">Edit Weekly Activities</div>';
    const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px';
    const inp = document.createElement('input'); inp.placeholder='Add an activity…'; inp.style.flex='1'; inp.className='input';
    const add = document.createElement('button'); add.className='btn primary'; add.textContent='Add';
    add.onclick=()=>{ const t=inp.value.trim(); if(!t) return; DEFAULTS.activities.push(t); state.activities.push(false); inp.value=''; LS.set('activities_items', DEFAULTS.activities); persist(); render(); };
    row.appendChild(inp); row.appendChild(add); ed.appendChild(row);
    host.appendChild(ed);
  }
}

function renderStars(){
  const host = el('#starsBoard'); host.innerHTML='';
  const h = document.createElement('div'); h.innerHTML='<div style="font-weight:600;font-size:18px">⭐ Stars Board</div>'; host.appendChild(h);
  const v = document.createElement('div'); v.style.fontSize='22px'; v.style.fontWeight='700'; v.textContent = state.stars+' ⭐'; host.appendChild(v);
  const row=document.createElement('div'); row.className='flex';
  const add1 = btn('+1 Star (+10m)', ()=>{ state.stars++; state.mins+=10; persist(); renderStars(); renderTablet(); confettiBurst(); });
  const add5 = btn('+5 Stars (+50m)', ()=>{ state.stars+=5; state.mins+=50; persist(); renderStars(); renderTablet(); confettiBurst(24); });
  const reset = btn('Reset', ()=>{ state.stars=0; persist(); renderStars(); });
  row.append(add1, add5, reset); host.appendChild(row);
}

function btn(text, on){ const b=document.createElement('button'); b.textContent=text; b.onclick=on; b.className='btn'; return b; }

function renderTablet(){
  const host = el('#tabletTime'); host.innerHTML='';
  const h = document.createElement('div'); h.innerHTML='<div style="font-weight:600;font-size:18px">📱 Tablet Time Bank</div>'; host.appendChild(h);
  const v = document.createElement('div'); v.style.fontSize='22px'; v.style.fontWeight='700'; v.textContent = fmt(state.mins) + `  (${state.mins} min)`; host.appendChild(v);
  const row = document.createElement('div'); row.className='flex';
  [[5,'+5'],[10,'+10'],[30,'+30'],[60,'+60']].forEach(([n,label])=>{
    row.appendChild(btn(label, ()=>{ state.mins+=n; persist(); renderTablet(); }));
  });
  [[5,'-5'],[10,'-10'],[30,'-30']].forEach(([n,label])=>{
    row.appendChild(btn(label, ()=>{ state.mins=Math.max(0,state.mins-n); persist(); renderTablet(); }));
  });
  host.appendChild(row);
  const small = document.createElement('div'); small.className='muted'; small.textContent='Daily baseline and bonuses are automatic.'; host.appendChild(small);
}

function renderMoney(){
  const host = el('#moneyBank'); host.innerHTML='';
  const h = document.createElement('div'); h.innerHTML='<div style="font-weight:600;font-size:18px">💰 Weekly Allowance & Bank</div>'; host.appendChild(h);
  const bank = LS.get('bank', {save:0, spend:0, donate:0});
  const canAdd = state.chores.every(Boolean) && !state.allowanceAdded;
  const row = document.createElement('div'); row.className='flex'; row.style.alignItems='center';
  const add = btn(canAdd ? 'Add $5 Now (+30m)' : 'Finish chores to add', ()=>{
    if(!canAdd) return;
    const third = Math.round((5/3)*100)/100; const save=third, spend=third, donate=Math.round((5-save-spend)*100)/100;
    bank.save=+(bank.save+save).toFixed(2); bank.spend=+(bank.spend+spend).toFixed(2); bank.donate=+(bank.donate+donate).toFixed(2);
    LS.set('bank', bank); state.mins+=30; state.allowanceAdded=true; persist(); renderMoney(); renderTablet(); confettiBurst(24);
  });
  if(!canAdd) add.style.opacity='0.6';
  add.className='btn primary';
  const nums = document.createElement('div'); nums.textContent = `Save: $${bank.save.toFixed(2)} • Spend: $${bank.spend.toFixed(2)} • Donate: $${bank.donate.toFixed(2)}`;
  row.append(add, nums); host.appendChild(row);
}

function renderRewards(){
  const host = el('#rewards'); host.innerHTML='';
  const h = document.createElement('div'); h.innerHTML='<div style="font-weight:600;font-size:18px">🎁 Rewards Wishlist</div>'; host.appendChild(h);
  const row = document.createElement('div'); row.className='flex';
  const inp = document.createElement('input'); inp.placeholder='Add a reward idea…'; inp.style.flex='1'; inp.className='input';
  const add = document.createElement('button'); add.textContent='Add'; add.className='btn primary';
  add.onclick=()=>{ const t=inp.value.trim(); if(!t) return; state.rewards=[{id:Date.now(),text:t}, ...state.rewards]; inp.value=''; persist(); renderRewards(); confettiBurst(); };
  row.append(inp, add); host.appendChild(row);

  const list = document.createElement('div');
  if(state.rewards.length===0){ const p=document.createElement('div'); p.className='muted'; p.textContent='No rewards yet. Add one!'; list.appendChild(p); }
  state.rewards.forEach(r=>{
    const li=document.createElement('div'); li.className='row space';
    const left=document.createElement('span'); left.textContent = `✨ ${r.text}`;
    const rem = btn('Remove', ()=>{ state.rewards = state.rewards.filter(x=>x.id!==r.id); persist(); renderRewards(); });
    li.append(left, rem); list.appendChild(li);
  });
  host.appendChild(list);
}

function render(){
  el('#dateLine').textContent = `${state.today} • ${tz.replace('_',' ')}`;
  renderTabs();
  renderContent();
  renderStars();
  renderTablet();
  renderMoney();
  renderRewards();
}
function bootstrap(){
  // baseline if needed on first load
  if(state.baselineDate !== state.today){ state.mins += 30; state.baselineDate = state.today; }
  persist(); render(); resetTimers();
}
bootstrap();
</script>
</body>
</html>
